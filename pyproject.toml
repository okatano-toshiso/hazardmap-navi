[project]
name = "hinan"
version = "0.1.0"
description = "Konohana evacuation guide: hazard depth, hazard-matched shelters, walking routes and grounded AI advice from open data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask==3.1.*",
    "pillow==13.*",
    "pydantic==2.*",
]

[dependency-groups]
dev = ["pytest==9.*"]
# Offline data preparation only (scripts/fetch_data.py). Not needed to run the app.
data = ["osmnx==2.*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hinan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
default-groups = ["dev"]
