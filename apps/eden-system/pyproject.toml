[project]
name = "eden-system"
version = "0.1.0"
description = "EDEN SYSTEM prototype: leave comments on places and on AI-recognised objects, public or friends-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask==3.1.*",
    "pillow==13.*",
    "pydantic==2.*",
]

[dependency-groups]
dev = ["pytest==9.*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
